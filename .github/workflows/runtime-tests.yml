name: HumHub runtime tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  releases:
    name: HumHub ${{ matrix.humhub }} / PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        humhub: ['v1.19.3']
        php: ['8.2', '8.3']
    uses: humhub/module-coding-standards/.github/workflows/codeception-base.yml@d307975192d4615971583dbbd73cedb64b0a08f7
    with:
      module-id: orgmap
      humhub-branch: ${{ matrix.humhub }}
      php: '["${{ matrix.php }}"]'
      databases: '[{"engine":"mysql","version":"8.4"}]'

  frontend:
    name: OrgMap frontend regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/P2FrontendTest.cjs
      - run: node tests/LabelCoordinatesTest.cjs
      - run: node tests/TreeEventTargetTest.cjs
